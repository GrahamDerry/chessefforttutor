<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Effort Tutor</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Chess Effort Tutor</h1>
  <nav><a href="/" class="on">Drill</a><a href="/stats">Stats</a></nav>
  <div class="spacer"></div>
  <div class="session" id="session">0 / 0</div>
</header>
<main>
  <div class="layout">
    <div>
      <div class="board" id="board"></div>
      <div class="meta">
        <span class="tomove" id="tomove"></span>
        <button class="replay hidden" id="replay" title="Replay the lead-in">Replay <kbd>R</kbd></button>
        <span class="clock" id="clock">--:--</span>
      </div>
      <div class="moves" id="moves"></div>
    </div>
    <div class="prompt">
      <h2>Think long, or think short?</h2>
      <div class="sub" id="sub">Loading…</div>
      <div class="choices">
        <button class="choice" id="btn-long" data-answer="LONG">
          <kbd>L</kbd><b>Think long</b>
          <span>This position needs real calculation.</span>
        </button>
        <button class="choice" id="btn-short" data-answer="SHORT">
          <kbd>S</kbd><b>Think short</b>
          <span>Play it quickly and bank the clock.</span>
        </button>
      </div>
      <div class="reveal hidden" id="reveal">
        <div class="verdict" id="verdict"></div>
        <p id="explanation"></p>
        <dl class="facts" id="facts"></dl>
        <div class="actions">
          <button class="next" id="next">Next <kbd>↵</kbd></button>
          <a id="gamelink" href="#" target="_blank" rel="noopener">View game on Chess.com →</a>
        </div>
      </div>
    </div>
  </div>
</main>
<script type="module" src="/static/drill.js"></script>
</body>
</html>
